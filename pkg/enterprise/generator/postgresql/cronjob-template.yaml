apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Name }}
  namespace: {{ .Namespace }}
spec:
  schedule: "{{ .Schedule }}"
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: snapshot
            image: postgres:15
            env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .SecretName }}
                  key: {{ .SecretKey }}
            command: ["sh", "-c"]
            args:
            - |
              psql -h {{ .Host }} \
                   -p {{ .Port }} \
                   -U {{ .PgUser }} \
                   -d {{ .Database }} \
                   -c "SELECT snapshot_pg_stat_activity();"
