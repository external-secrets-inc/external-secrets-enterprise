apiVersion: generators.external-secrets.io/v1alpha1
kind: Federation
metadata:
  name: local-federation-generator
  namespace: federation-example
spec:
  server:
    url: "http://external-secrets-federation-server.external-secrets.svc:8000"
  generator:
    namespace: "federation-example"
    kind: "Fake"
    name: "federation-generator"
  auth:
    tokenSecretRef:
      name: "federation-token"
      key: "token"
    metadataSecretRef:
      name: "federation-token"
      key: "metadata"
