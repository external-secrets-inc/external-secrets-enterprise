    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: KubernetesCluster is the schema for a Kubernetes target.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              kubeConfigSecretRef:
                description: |-
                  kubeConfigSecretRef is an optional reference to a Secret containing a kubeconfig.
                  If empty, in-cluster config is used.
                properties:
                  key:
                    description: |-
                      A key in the referenced Secret.
                      Some instances of this field may be defaulted, in others it may be required.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[-._a-zA-Z0-9]+$
                    type: string
                  name:
                    description: The name of the Secret resource being referred to.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                  namespace:
                    description: |-
                      The namespace of the Secret resource being referred to.
                      Ignored if referent is not cluster-scoped, otherwise defaults to the namespace of the referent.
                    maxLength: 63
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                    type: string
                type: object
              namespaces:
                description: |-
                  namespaces controls which namespaces are in scope during scans.
                  If both include and exclude are empty, all namespaces are included.
                  Include/exclude support glob-like patterns (implementation detail in provider).
                properties:
                  exclude:
                    items:
                      type: string
                    type: array
                  include:
                    items:
                      type: string
                    type: array
                type: object
              scan:
                description: scan toggles specific binding paths to consider as "manifest
                  bindings".
                properties:
                  includeEnvFrom:
                    default: true
                    description: 'IncludeEnvFrom: consider containers[*].envFrom[].secretRef
                      and initContainers[] equivalents.'
                    type: boolean
                  includeEnvSecretKeyRefs:
                    default: true
                    description: 'IncludeEnvSecretKeyRefs: consider containers[*].env[].valueFrom.secretKeyRef
                      (and initContainers).'
                    type: boolean
                  includeImagePullSecrets:
                    default: false
                    description: 'IncludeImagePullSecrets: consider spec.imagePullSecrets
                      and SA.imagePullSecrets.'
                    type: boolean
                  includeVolumeSecrets:
                    default: true
                    description: 'IncludeVolumeSecrets: consider volumes[].secret.secretName.'
                    type: boolean
                type: object
              selector:
                description: |-
                  selector filters workloads/pods by labels before scan evaluation.
                  If empty, all labeled/unlabeled workloads are considered.
                properties:
                  matchExpressions:
                    description: matchExpressions is a list of label selector requirements.
                      The requirements are ANDed.
                    items:
                      description: |-
                        A label selector requirement is a selector that contains values, a key, and an operator that
                        relates the key and values.
                      properties:
                        key:
                          description: key is the label key that the selector applies
                            to.
                          type: string
                        operator:
                          description: |-
                            operator represents a key's relationship to a set of values.
                            Valid operators are In, NotIn, Exists and DoesNotExist.
                          type: string
                        values:
                          description: |-
                            values is an array of string values. If the operator is In or NotIn,
                            the values array must be non-empty. If the operator is Exists or DoesNotExist,
                            the values array must be empty. This array is replaced during a strategic
                            merge patch.
                          items:
                            type: string
                          type: array
                          x-kubernetes-list-type: atomic
                      required:
                      - key
                      - operator
                      type: object
                    type: array
                    x-kubernetes-list-type: atomic
                  matchLabels:
                    additionalProperties:
                      type: string
                    description: |-
                      matchLabels is a map of {key,value} pairs. A single {key,value} in the matchLabels
                      map is equivalent to an element of matchExpressions, whose key field is "key", the
                      operator is "In", and the values array contains only "value". The requirements are ANDed.
                    type: object
                type: object
                x-kubernetes-map-type: atomic
